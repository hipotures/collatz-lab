[package]
name = "collatz-lab"
version = "0.1.0"
edition = "2021"
description = "Exact-arithmetic symbolic workbench for Collatz parity itineraries and conditional descent certificates"
license = "CC0-1.0"
repository = "https://github.com/hipotures/collatz-lab"
publish = false

[lib]
name = "collatz_lab"
path = "src/lib.rs"

[[bin]]
name = "collatz-lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
overflow-checks = true
