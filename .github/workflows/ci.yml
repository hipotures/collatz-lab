name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Unit, property and small end-to-end tests only; no open-ended searches.
      - run: cargo test --locked --all-targets

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check for forbidden proof escapes
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|unsafe|native_decide|implemented_by|extern)\b' CollatzLab CollatzLab.lean; then
            echo "Forbidden keyword found in Lean formalization!"
            exit 1
          fi
      - name: Build Lean 4 formalization
        run: lake build
      - name: Audit theorem axioms
        run: |
          if ! output=$(lake env lean research/lean-audit/FamilyAudit.lean); then
            printf '%s\n' "$output"
            exit 1
          fi
          echo "$output"
          # Audit every output line, including declarations requiring no foundation axioms.
          # Reject missing declarations, unexpected diagnostics, and any unapproved dependency.
          expected_count=44
          actual_count=$(printf '%s\n' "$output" | grep -cE "^'CollatzLab\.[A-Za-z0-9_.']+' (depends on axioms:|does not depend on any axioms)" || true)
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "Error: expected $expected_count audited theorems, found $actual_count"
            exit 1
          fi
          unexpected=$(printf '%s\n' "$output" | grep -Ev "^'CollatzLab\.[A-Za-z0-9_.']+' (does not depend on any axioms|depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\])$" || true)
          if [ -n "$unexpected" ]; then
            echo "Error: unapproved dependency or malformed audit output:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
