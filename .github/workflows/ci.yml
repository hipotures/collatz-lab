name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Unit, property and small end-to-end tests only; no open-ended searches.
      - run: cargo test --locked --all-targets
      - name: Reproduce bounded Phase 7 certificates
        run: python3 research/mahler-uncovered/verify_uncovered.py --check

      - name: Verify unequal-weight finite certificates
        run: |
          python3 research/phase10/verify_unequal.py --check
          python3 research/phase10/search_unequal.py --check
          python3 research/phase10/verify_spectral.py --check
          python3 research/phase10/verify_sparse_family.py --check
          python3 research/phase10/generate_catalogue.py --check

      - name: Verify Phase 11 exact regressions
        run: |
          python3 research/phase11/verify_noncontracting.py
          python3 research/phase11/verify_spectral_boundary.py
          python3 research/phase11/verify_partial_return.py

      - name: Verify Phase 12 finite return evidence
        run: python3 research/phase12/verify_returns.py --check

      - name: Verify Phase 13 exact heights and rational shadows
        run: |
          python3 research/phase13/test_height.py
          python3 research/phase13/experiments.py --check
          python3 research/phase13/verify_certificates.py research/phase13/heights.json.gz
          python3 research/phase13/verify_analytics.py --check
          python3 research/phase13/verify_modular.py --check
          python3 research/phase13/verify_shadow_cancellation.py

      - name: Verify finite general-polynomial regressions
        run: python3 research/phase8/verify_polynomial.py

      - name: Check final overnight provenance and stale-metadata controls
        run: |
          python3 research/phase13/overnight/test_provenance.py
          python3 research/phase13/overnight/finalize_provenance.py --check

      - name: Independent Phase 9 cross-checks of the written proof
        run: python3 research/phase9/verify_independent.py

      - name: Static consistency check of the manuscript sources
        run: python3 paper/check_tex.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check for forbidden proof escapes
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|unsafe|native_decide|implemented_by|extern)\b' CollatzLab CollatzLab.lean; then
            echo "Forbidden keyword found in Lean formalization!"
            exit 1
          fi
      - name: Build Lean 4 formalization
        run: lake build CollatzLab CollatzLab.ShadowCancellation
      - name: Audit theorem axioms
        run: |
          if ! output=$(lake env lean research/lean-audit/FamilyAudit.lean); then
            printf '%s\n' "$output"
            exit 1
          fi
          echo "$output"
          # Exact source declaration order/count, approved foundations only; tolerate
          # Lean's wrapping only when continuation tokens name those foundations.
          python3 research/lean-audit/check_axioms.py --self-test
          printf '%s\n' "$output" | python3 research/lean-audit/check_axioms.py --expected-count 653
          if ! shadow_output=$(lake env lean research/lean-audit/ShadowCancellationAudit.lean); then
            printf '%s\n' "$shadow_output"
            exit 1
          fi
          echo "$shadow_output"
          printf '%s\n' "$shadow_output" | python3 research/lean-audit/check_shadow_axioms.py --expected-shadow-count 48
      - name: Check Lean declarations named in the manuscript
        run: |
          python3 paper/check_tex.py --lean-names > "$RUNNER_TEMP/NameCheck.lean"
          lake env lean "$RUNNER_TEMP/NameCheck.lean" > /dev/null
      - name: Check research interfaces
        run: |
          lake env lean research/phase11/Signatures.lean
          lake env lean research/phase12/Signatures.lean
          lake env lean research/phase13/Signatures.lean
          lake env lean research/phase13/ShadowCancellationSignatures.lean
