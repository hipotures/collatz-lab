name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Unit, property and small end-to-end tests only; no open-ended searches.
      - run: cargo test --locked --all-targets
      - name: Reproduce bounded Phase 7 certificates
        run: python3 research/mahler-uncovered/verify_uncovered.py --check

      - name: Verify finite general-polynomial regressions
        run: python3 research/phase8/verify_polynomial.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check for forbidden proof escapes
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|unsafe|native_decide|implemented_by|extern)\b' CollatzLab CollatzLab.lean; then
            echo "Forbidden keyword found in Lean formalization!"
            exit 1
          fi
      - name: Build Lean 4 formalization
        run: lake build
      - name: Audit theorem axioms
        run: |
          if ! output=$(lake env lean research/lean-audit/FamilyAudit.lean); then
            printf '%s\n' "$output"
            exit 1
          fi
          echo "$output"
          # Exact source declaration order/count, approved foundations only; tolerate
          # Lean's wrapping only when continuation tokens name those foundations.
          python3 research/lean-audit/check_axioms.py --self-test
          printf '%s\n' "$output" | python3 research/lean-audit/check_axioms.py --expected-count 245
